<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Astronaut in suit, visor down">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#11151C"/>
      <stop offset="100%" stop-color="#07090C"/>
    </radialGradient>
    <linearGradient id="helmet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2F4F8"/>
      <stop offset="55%" stop-color="#D7DCE4"/>
      <stop offset="100%" stop-color="#AEB6C2"/>
    </linearGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E7EAF0"/>
      <stop offset="100%" stop-color="#B7BFCC"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#FFE08A"/>
      <stop offset="42%" stop-color="#E9A93C"/>
      <stop offset="100%" stop-color="#9A6516"/>
    </linearGradient>
    <linearGradient id="visorSheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="96" height="96" rx="10" fill="url(#bg)"/>

  <!-- starfield -->
  <g fill="#5A6371">
    <circle cx="14" cy="16" r="0.9"/>
    <circle cx="80" cy="22" r="0.8"/>
    <circle cx="70" cy="11" r="0.6"/>
    <circle cx="24" cy="30" r="0.6"/>
    <circle cx="86" cy="48" r="0.7"/>
    <circle cx="10" cy="44" r="0.7"/>
  </g>

  <!-- suit shoulders -->
  <path d="M14 96 C16 76 30 66 48 66 C66 66 80 76 82 96 Z" fill="url(#suit)" stroke="#9099A6" stroke-width="1.2"/>
  <!-- suit neck ring -->
  <rect x="34" y="60" width="28" height="9" rx="4" fill="#C9D0DB" stroke="#9099A6" stroke-width="1"/>

  <!-- AIRLOCK patch -->
  <g transform="translate(48 84)">
    <rect x="-13" y="-7" width="26" height="14" rx="3" fill="#0E1218" stroke="#FF7A3D" stroke-width="1.1"/>
    <text x="0" y="3.4" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="6.2" letter-spacing="0.5" fill="#FF7A3D">AIRLOCK</text>
  </g>

  <!-- helmet shell -->
  <circle cx="48" cy="40" r="30" fill="url(#helmet)" stroke="#9099A6" stroke-width="1.4"/>

  <!-- visor (down, opaque reflective gold, no face) -->
  <path d="M28 36 C28 26 37 20 48 20 C59 20 68 26 68 36 L68 46 C68 55 59 60 48 60 C37 60 28 55 28 46 Z" fill="url(#visor)" stroke="#7A4E12" stroke-width="1.2"/>
  <!-- visor reflective sheen -->
  <path d="M28 36 C28 26 37 20 48 20 C59 20 68 26 68 36 L68 46 C68 55 59 60 48 60 C37 60 28 55 28 46 Z" fill="url(#visorSheen)"/>
  <!-- horizon reflection band -->
  <path d="M30 41 C40 38 56 38 66 41" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.6" stroke-linecap="round"/>

  <!-- helmet side latches -->
  <circle cx="24" cy="42" r="2.4" fill="#C9D0DB" stroke="#9099A6" stroke-width="0.8"/>
  <circle cx="72" cy="42" r="2.4" fill="#C9D0DB" stroke="#9099A6" stroke-width="0.8"/>
</svg>
